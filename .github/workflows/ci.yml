name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Reject legacy SEO hostname
        run: |
          if grep -R "tanvi-dental-care.vercel.app" src .github --exclude-dir=node_modules; then
            echo "Legacy Vercel hostname found in SEO-sensitive source."
            exit 1
          fi

      - name: Build
        run: npm run build
